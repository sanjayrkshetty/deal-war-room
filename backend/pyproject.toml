[project]
name = "dwr"
version = "2.0.0a0"
description = "Deal War Room - citation-enforced tender deal intelligence backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
