services:
  - type: web
    name: dwr-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dwr.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: GROQ_API_KEY
        sync: false
      - key: DWR_MODEL_TRIAGE
        value: openai/gpt-oss-20b
      - key: DWR_MODEL_SYNTH
        value: openai/gpt-oss-120b
      - key: DWR_EMBEDDER_ENABLED
        value: "false"
      - key: DWR_SEED_FIXTURES
        value: "true"
      - key: DWR_DAILY_TOKEN_BUDGET
        value: "400000"
      - key: DWR_MAX_ANALYSES_PER_HOUR
        value: "15"
      - key: DWR_CORS_ORIGINS
        value: "http://localhost:3000,https://deal-war-room.vercel.app"
